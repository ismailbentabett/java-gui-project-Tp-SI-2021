name: Bug report
description: Report something that does not work as expected in InvoiceDesk.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please check existing issues first.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch the app with `java -cp bin main`
        2. Enter a client name
        3. Add products ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version
      description: Output of `java -version`.
      placeholder: openjdk 21.0.x
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: dropdown
    id: launch
    attributes:
      label: How did you run the app?
      options:
        - Command line (javac / java)
        - Eclipse
        - Other IDE
  - type: textarea
    id: logs
    attributes:
      label: Console output or stack trace
      render: text
